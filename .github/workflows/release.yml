# Builds the production .mcpb for submission to the Claude connector
# directory. No GitHub Release is created — distribution happens through
# the directory; this workflow's job is to produce the bundle (with the
# production license key, which exists only as an Actions secret) and
# surface the matching CHANGELOG.md section for the submission form.
name: Build release bundle

on:
  push:
    tags:
      - "v*"
  # Manual rebuilds (e.g. a transient failure after tagging, or building
  # main for a dry run) without moving any tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify license key secret is present
        env:
          LICENSE_KEY: ${{ secrets.VITE_NUTRIENT_LICENSE_KEY }}
        run: |
          if [ -z "$LICENSE_KEY" ]; then
            echo "::error::VITE_NUTRIENT_LICENSE_KEY secret is empty or unset — a bundle built without it ships a watermarked trial-mode viewer."
            exit 1
          fi
          echo "License key secret present (${#LICENSE_KEY} chars)."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_NUTRIENT_LICENSE_KEY: ${{ secrets.VITE_NUTRIENT_LICENSE_KEY }}

      - name: Extract changelog section for the submission form
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version"
            exit 1
          fi
          {
            echo "## v$version — changelog section for the connector submission form"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat release-notes.md

      - name: Upload .mcpb bundle as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nutrient-pdf-editor-mcp
          path: build/nutrient-pdf-editor-mcp-*.mcpb
          if-no-files-found: error
